# FileProtectFS — push 到 master 自动编译 → 发布到 Releases
name: Build & Release

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

env:
  CONFIG: Release

jobs:
  build-and-release:
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v4

    # ===================================================================
    # 1. 安装 WDK（多路尝试）
    # ===================================================================
    - name: Debug - check environment
      shell: pwsh
      run: |
        Write-Host "=== VS Where ==="
        & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.WindowsDriverKit 2>$null
        Write-Host "=== choco list ==="
        choco list windowsdriverkit --limit-output 2>$null
        if ($LASTEXITCODE -ne 0) { Write-Host "choco not available or no package" }
        Write-Host "=== winget search ==="
        winget search "Windows Driver Kit" --accept-source-agreements 2>$null
        if ($LASTEXITCODE -ne 0) { Write-Host "winget not available" }
        Write-Host "=== VS components ==="
        & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -format json | ConvertFrom-Json | Select-Object -ExpandProperty catalog | Select-Object productDisplayVersion, productLine

    - name: Install WDK (winget)
      shell: pwsh
      run: |
        # 尝试1: winget
        winget install "Windows Driver Kit" -e --accept-source-agreements --accept-package-agreements
        if ($LASTEXITCODE -eq 0 -or $LASTEXITCODE -eq 3010) {
          Write-Host "WDK installed via winget"
          return
        }
        Write-Host "winget failed ($LASTEXITCODE), trying choco..."

        # 尝试2: choco（不指定版本）
        choco install windowsdriverkit -y --no-progress
        if ($LASTEXITCODE -eq 0 -or $LASTEXITCODE -eq 3010) {
          Write-Host "WDK installed via choco"
          return
        }
        Write-Host "choco failed ($LASTEXITCODE), trying direct download..."

        # 尝试3: 微软官方下载 WDK 11
        $urls = @(
          "https://go.microsoft.com/fwlink/?linkid=2292239",   # WDK 11 24H2
          "https://go.microsoft.com/fwlink/?linkid=2272238",   # WDK 11 23H2
          "https://go.microsoft.com/fwlink/?linkid=2195408"    # WDK 10
        )
        foreach ($url in $urls) {
          try {
            $out = "$env:TEMP\wdk_installer.exe"
            Write-Host "Downloading $url ..."
            Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing
            if ((Get-Item $out).Length -gt 1MB) {
              Write-Host "Installing (size: $((Get-Item $out).Length/1KB KB))..."
              $p = Start-Process -Wait -PassThru -FilePath $out -ArgumentList "/quiet /install"
              if ($p.ExitCode -eq 0 -or $p.ExitCode -eq 3010) {
                Write-Host "WDK installed via direct download!"
                return
              }
              Write-Host "Installer exit: $($p.ExitCode)"
            }
          } catch { Write-Host "Failed: $_" }
        }

        throw "All WDK installation methods failed!"
      continue-on-error: true

    # ===================================================================
    # 2. 编译 x86 驱动（即使失败也继续，看错误信息）
    # ===================================================================
    - name: Build driver (x86)
      shell: cmd
      continue-on-error: true
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x86 -host_arch=x64
        echo "=== Checking WDK environment ==="
        where /R "C:\Program Files (x86)\Windows Kits" WindowsDriver.default.props 2>&1
        where /R "C:\Program Files\Windows Kits" WindowsDriver.default.props 2>&1
        set WDKContentRoot 2>&1
        echo "=== Building ==="
        msbuild driver\fileprotect.vcxproj /p:Configuration=%CONFIG% /p:Platform=x86 /p:DebugType=none /v:minimal
        if %ERRORLEVEL% NEQ 0 (
            echo "=== x86 build FAILED with code %ERRORLEVEL% ==="
        )

    # ===================================================================
    # 3. 编译 x64 驱动
    # ===================================================================
    - name: Build driver (x64)
      shell: cmd
      continue-on-error: true
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
        echo "=== Checking WDK environment ==="
        where /R "C:\Program Files (x86)\Windows Kits" WindowsDriver.default.props 2>&1
        where /R "C:\Program Files\Windows Kits" WindowsDriver.default.props 2>&1
        echo "=== Building ==="
        msbuild driver\fileprotect.vcxproj /p:Configuration=%CONFIG% /p:Platform=x64 /p:DebugType=none /v:minimal
        if %ERRORLEVEL% NEQ 0 (
            echo "=== x64 build FAILED with code %ERRORLEVEL% ==="
        )

    # ===================================================================
    # 4. 编译 C# 控制程序 (x86 + x64 单文件)
    # ===================================================================
    - name: Build C# (x86 single-file)
      shell: pwsh
      run: |
        dotnet publish -c Release -r win-x86 `
          -p:PlatformTarget=x86 `
          -p:PublishSingleFile=true `
          -p:SelfContained=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -p:DebugType=embedded `
          --self-contained true `
          -o publish\x86

    - name: Build C# (x64 single-file)
      shell: pwsh
      run: |
        dotnet publish -c Release -r win-x64 `
          -p:PlatformTarget=x64 `
          -p:PublishSingleFile=true `
          -p:SelfContained=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -p:DebugType=embedded `
          --self-contained true `
          -o publish\x64

    # ===================================================================
    # 5. 收集所有文件
    # ===================================================================
    - name: Collect release files
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path release_files

        # 驱动文件
        $sysFiles = Get-ChildItem -Recurse -Filter "FileProtectFS.sys" | Where-Object {
          $_.DirectoryName -notmatch "obj"
        }
        $sysFiles | ForEach-Object {
          $arch = if ($_.FullName -match "\\x86\\") {"x86"} else {"x64"}
          $dest = "release_files/FileProtectFS-$arch.sys"
          Copy-Item $_.FullName $dest -Force
          Write-Host "Driver: $dest ($($_.Length/1KB -as [int]) KB)"
        }

        # 控制程序
        if (Test-Path publish\x86\FileProtect.exe) {
          Copy-Item publish\x86\FileProtect.exe release_files/FileProtect.exe
          $size = (Get-Item publish\x86\FileProtect.exe).Length
          Write-Host "C# x86: $( $size/1KB -as [int] ) KB"
        }
        if (Test-Path publish\x64\FileProtect.exe) {
          Copy-Item publish\x64\FileProtect.exe release_files/FileProtect-x64.exe
          $size = (Get-Item publish\x64\FileProtect.exe).Length
          Write-Host "C# x64: $( $size/1KB -as [int] ) KB"
        }

        # INF 安装文件
        Copy-Item driver\fileprotectfs.inf release_files/ -Force

        # 清单
        Write-Host "`n=== Release Files ==="
        Get-ChildItem release_files | ForEach-Object {
          Write-Host "$($_.Name)`t$($_.Length) bytes"
        }

    # ===================================================================
    # 6. 发布到 Releases（草稿）
    # ===================================================================
    - name: Publish to GitHub Releases
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $tag = "v1.0-build.$env:GITHUB_RUN_NUMBER"

        # Release 说明
        $sha = "$env:GITHUB_SHA".Substring(0,7)
        $files = Get-ChildItem release_files
        $fileList = $files | ForEach-Object { "- $($_.Name) ($($_.Length/1KB -as [int]) KB)" } | Out-String

        $notes = @"
        FileProtectFS — 内核级文件权限保护驱动

        ## 文件清单
        — 包含文件已自动编译于 $([DateTime]::UtcNow.ToString('yyyy-MM-dd HH:mm')) UTC

        $fileList
        ## 使用说明
        [完整文档](https://github.com/$env:GITHUB_REPOSITORY)

        ```bat
        :: 1. 启用测试签名（64位系统）
        bcdedit /set testsigning on
        重启

        :: 2. 安装驱动
        FileProtect driver install
        FileProtect driver start

        :: 3. 保护文件
        FileProtect protect --ring0 C:\目标文件

        :: 4. 查看保护状态
        FileProtect driver status
        ```
        "@

        # 创建 Release（草稿模式）
        gh release create $tag `
          --repo $env:GITHUB_REPOSITORY `
          --title "FileProtectFS Build #$env:GITHUB_RUN_NUMBER" `
          --notes "$notes" `
          --draft `
          ./release_files/*

        Write-Host "✅ Release created: $tag"
        Write-Host "   https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$tag"
