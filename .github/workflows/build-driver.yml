# FileProtectFS — push 到 master 自动编译 → 发布到 Releases
name: Build & Release

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

env:
  CONFIG: Release

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write       # 需要写权限才能创建 Release
      id-token: write

    steps:
    - uses: actions/checkout@v4

    # ===================================================================
    # 1. 查找 VS 路径（动态适配 win-2022/2025）
    # ===================================================================
    - name: Find VS + setup env
      shell: pwsh
      run: |
        $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
          -latest -products * -format json | ConvertFrom-Json
        $vsPath = $vs.installationPath
        $vsVer = $vs.catalog.productDisplayVersion
        Write-Host "VS Path: $vsPath"
        Write-Host "VS Version: $vsVer"
        echo "VS_PATH=$vsPath" >> $env:GITHUB_ENV
        echo "VS_VERSION=$vsVer" >> $env:GITHUB_ENV

    # ===================================================================
    # 2. 安装 WDK（winget，windows-latest 预装）
    # ===================================================================
    - name: Install WDK (winget)
      shell: pwsh
      run: |
        # 先检查是否已装
        $existing = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\build" `
          -Filter "WindowsDriver.default.props" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
        if ($existing) {
          Write-Host "WDK already installed at: $($existing.FullName)"
          return
        }

        # winget 安装
        $packages = @(
          "Microsoft.WindowsWDK.10.0.22621",
          "Microsoft.WindowsWDK"
        )
        foreach ($pkg in $packages) {
          Write-Host "Trying winget: $pkg"
          winget install --id $pkg -e --accept-source-agreements --accept-package-agreements --silent
          $ec = $LASTEXITCODE
          if ($ec -eq 0 -or $ec -eq 3010) {
            Write-Host "Installed: $pkg"
            exit 0
          }
          Write-Host "Failed ($ec), trying next..."
        }
        Write-Host "All winget attempts failed. Checking alternatives..."
        choco install windowsdriverkit -y --no-progress 2>$null
        if ($LASTEXITCODE -eq 0 -or $LASTEXITCODE -eq 3010) {
          Write-Host "Installed via choco"
          exit 0
        }
        Write-Host "::warning::WDK could not be installed, driver will not build"
      continue-on-error: true

    # ===================================================================
    # 3. 编译 x86 驱动
    # ===================================================================
    - name: Build driver (x86)
      shell: cmd
      continue-on-error: true
      run: |
        call "%VS_PATH%\Common7\Tools\VsDevCmd.bat" -arch=x86 -host_arch=x64
        echo === WDK check ===
        where /R "%ProgramFiles(x86)%\Windows Kits" WindowsDriver.default.props 2>&1
        if exist "%ProgramFiles(x86)%\Windows Kits\10\build\WindowsDriver.default.props" (
          set WDKContentRoot=%ProgramFiles(x86)%\Windows Kits\10\
        )
        echo === Building x86 ===
        msbuild driver\fileprotect.vcxproj /p:Configuration=%CONFIG% /p:Platform=x86 /p:DebugType=none /v:minimal
        if errorlevel 1 echo x86 BUILD FAILED

    # ===================================================================
    # 4. 编译 x64 驱动
    # ===================================================================
    - name: Build driver (x64)
      shell: cmd
      continue-on-error: true
      run: |
        call "%VS_PATH%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
        echo === WDK check ===
        where /R "%ProgramFiles(x86)%\Windows Kits" WindowsDriver.default.props 2>&1
        if exist "%ProgramFiles(x86)%\Windows Kits\10\build\WindowsDriver.default.props" (
          set WDKContentRoot=%ProgramFiles(x86)%\Windows Kits\10\
        )
        echo === Building x64 ===
        msbuild driver\fileprotect.vcxproj /p:Configuration=%CONFIG% /p:Platform=x64 /p:DebugType=none /v:minimal
        if errorlevel 1 echo x64 BUILD FAILED

    # ===================================================================
    # 5. 编译 C# 控制程序
    # ===================================================================
    - name: Build C# (x86)
      shell: pwsh
      run: |
        dotnet publish -c Release -r win-x86 `
          -p:PlatformTarget=x86 `
          -p:PublishSingleFile=true `
          -p:SelfContained=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -p:DebugType=embedded `
          --self-contained true `
          -o publish\x86

    - name: Build C# (x64)
      shell: pwsh
      run: |
        dotnet publish -c Release -r win-x64 `
          -p:PlatformTarget=x64 `
          -p:PublishSingleFile=true `
          -p:SelfContained=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -p:DebugType=embedded `
          --self-contained true `
          -o publish\x64

    # ===================================================================
    # 6. 收集所有文件
    # ===================================================================
    - name: Collect release files
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path release_files

        # 驱动 — 放宽搜索范围
        $drvDirs = @("driver", ".")
        $sysFiles = Get-ChildItem -Recurse -Filter "FileProtectFS.sys" -ErrorAction SilentlyContinue
        Write-Host "All .sys files found:"
        $sysFiles | ForEach-Object { Write-Host "  $($_.FullName) ($($_.Length/1KB -as [int]) KB)" }

        if ($sysFiles.Count -eq 0) {
          Write-Host "::warning::No .sys files found anywhere, dumping directory..."
          Get-ChildItem -Recurse -Directory -Filter "Release" -ErrorAction SilentlyContinue |
            Select-Object -First 10 | ForEach-Object { Write-Host "  $($_.FullName)" }
        } else {
          $sysFiles | ForEach-Object {
            $arch = if ($_.FullName -match "\\x86\\|\\Win32\\") {"x86"} else {"x64"}
            $dest = "release_files/FileProtectFS-$arch.sys"
            Copy-Item $_.FullName $dest -Force
            Write-Host "Copied driver: $dest"
          }
        }

        # C#
        if (Test-Path publish\x86\FileProtect.exe) {
          Copy-Item publish\x86\FileProtect.exe release_files/FileProtect.exe
          $s = (Get-Item publish\x86\FileProtect.exe).Length
          Write-Host "C# x86: $( $s/1KB -as [int] ) KB"
        }
        if (Test-Path publish\x64\FileProtect.exe) {
          Copy-Item publish\x64\FileProtect.exe release_files/FileProtect-x64.exe
          $s = (Get-Item publish\x64\FileProtect.exe).Length
          Write-Host "C# x64: $( $s/1KB -as [int] ) KB"
        }

        # INF
        if (Test-Path driver\fileprotectfs.inf) {
          Copy-Item driver\fileprotectfs.inf release_files/
        }

        Write-Host "`n=== Release Files ==="
        Get-ChildItem release_files | ForEach-Object {
          Write-Host "$($_.Name)`t$($_.Length) bytes"
        }

    # ===================================================================
    # 7. 发布到 Releases
    # ===================================================================
    - name: Create GitHub Release (PowerShell API)
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $tag = "v1.0-build.$env:GITHUB_RUN_NUMBER"
        $repo = $env:GITHUB_REPOSITORY
        $headers = @{ Authorization = "Bearer $env:GH_TOKEN" }
        $api = "https://api.github.com/repos/$repo"

        Write-Host "Creating release $tag ..."

        # 1. 创建 Release
        $releaseBody = @{
          tag_name = $tag
          name = "FileProtectFS Build #$env:GITHUB_RUN_NUMBER"
          body = "FileProtectFS - kernel-level file ACL protection driver`nBuilt at $([DateTime]::UtcNow.ToString('yyyy-MM-dd HH:mm')) UTC"
          draft = $true
        }

        try {
          $release = Invoke-RestMethod -Uri "$api/releases" -Method Post `
            -Headers $headers -Body ($releaseBody | ConvertTo-Json) `
            -ContentType "application/json"
        } catch {
          $err = $_.Exception.Response
          $reader = New-Object System.IO.StreamReader($err.GetResponseStream())
          $respBody = $reader.ReadToEnd() | Out-String
          Write-Host "FAILED to create release: $respBody"
          # 可能 tag 已存在，尝试获取已有 release
          Write-Host "Trying to find existing release..."
          try {
            $existing = Invoke-RestMethod -Uri "$api/releases/tags/$tag" -Headers $headers
            $release = $existing
            Write-Host "Found existing release id=$($release.id)"
          } catch {
            Write-Host "No existing release found, creating with unique tag..."
            $tag = "v1.0-build.$env:GITHUB_RUN_NUMBER.$([DateTime]::UtcNow.ToString('HHmmss'))"
            $releaseBody.tag_name = $tag
            $release = Invoke-RestMethod -Uri "$api/releases" -Method Post `
              -Headers $headers -Body ($releaseBody | ConvertTo-Json) `
              -ContentType "application/json"
          }
        }

        $releaseId = $release.id
        Write-Host "Release id=$releaseId tag=$($release.tag_name)"

        # 2. 上传文件
        $files = Get-ChildItem -Path release_files -File
        foreach ($file in $files) {
          Write-Host "Uploading $($file.Name) ..."
          $uploadUri = "https://uploads.github.com/repos/$repo/releases/$releaseId/assets?name=$($file.Name)"
          try {
            $upload = Invoke-RestMethod -Uri $uploadUri -Method Post `
              -Headers $headers -ContentType "application/octet-stream" `
              -InFile $file.FullName
            Write-Host "  OK"
          } catch {
            Write-Host "  FAILED: $($_.Exception.Message)"
          }
        }

        Write-Host "Done: https://github.com/$repo/releases/tag/$tag"
