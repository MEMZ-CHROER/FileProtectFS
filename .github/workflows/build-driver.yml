# FileProtectFS — push 到 master 自动编译 → 发布到 Releases
name: Build & Release

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

env:
  CONFIG: Release

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    # ===================================================================
    # 1. 查找 VS 路径（动态适配 win-2022/2025）
    # ===================================================================
    - name: Find VS + setup env
      shell: pwsh
      run: |
        $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
          -latest -products * -format json | ConvertFrom-Json
        $vsPath = $vs.installationPath
        $vsVer = $vs.catalog.productDisplayVersion
        Write-Host "VS Path: $vsPath"
        Write-Host "VS Version: $vsVer"
        echo "VS_PATH=$vsPath" >> $env:GITHUB_ENV
        echo "VS_VERSION=$vsVer" >> $env:GITHUB_ENV

    # ===================================================================
    # 2. 安装 WDK（winget，windows-latest 预装）
    # ===================================================================
    - name: Install WDK (winget)
      shell: pwsh
      run: |
        # 先检查是否已装
        $existing = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\build" `
          -Filter "WindowsDriver.default.props" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
        if ($existing) {
          Write-Host "WDK already installed at: $($existing.FullName)"
          return
        }

        # winget 安装
        $packages = @(
          "Microsoft.WindowsWDK.10.0.22621",
          "Microsoft.WindowsWDK"
        )
        foreach ($pkg in $packages) {
          Write-Host "Trying winget: $pkg"
          winget install --id $pkg -e --accept-source-agreements --accept-package-agreements --silent
          $ec = $LASTEXITCODE
          if ($ec -eq 0 -or $ec -eq 3010) {
            Write-Host "Installed: $pkg"
            exit 0
          }
          Write-Host "Failed ($ec), trying next..."
        }
        Write-Host "All winget attempts failed. Checking alternatives..."
        choco install windowsdriverkit -y --no-progress 2>$null
        if ($LASTEXITCODE -eq 0 -or $LASTEXITCODE -eq 3010) {
          Write-Host "Installed via choco"
          exit 0
        }
        Write-Host "::warning::WDK could not be installed, driver will not build"
      continue-on-error: true

    # ===================================================================
    # 3. 编译 x86 驱动
    # ===================================================================
    - name: Build driver (x86)
      shell: cmd
      continue-on-error: true
      run: |
        call "%VS_PATH%\Common7\Tools\VsDevCmd.bat" -arch=x86 -host_arch=x64
        echo === WDK check ===
        where /R "%ProgramFiles(x86)%\Windows Kits" WindowsDriver.default.props 2>&1
        if exist "%ProgramFiles(x86)%\Windows Kits\10\build\WindowsDriver.default.props" (
          set WDKContentRoot=%ProgramFiles(x86)%\Windows Kits\10\
        )
        echo === Building x86 ===
        msbuild driver\fileprotect.vcxproj /p:Configuration=%CONFIG% /p:Platform=x86 /p:DebugType=none /v:minimal
        if errorlevel 1 echo x86 BUILD FAILED

    # ===================================================================
    # 4. 编译 x64 驱动
    # ===================================================================
    - name: Build driver (x64)
      shell: cmd
      continue-on-error: true
      run: |
        call "%VS_PATH%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
        echo === WDK check ===
        where /R "%ProgramFiles(x86)%\Windows Kits" WindowsDriver.default.props 2>&1
        if exist "%ProgramFiles(x86)%\Windows Kits\10\build\WindowsDriver.default.props" (
          set WDKContentRoot=%ProgramFiles(x86)%\Windows Kits\10\
        )
        echo === Building x64 ===
        msbuild driver\fileprotect.vcxproj /p:Configuration=%CONFIG% /p:Platform=x64 /p:DebugType=none /v:minimal
        if errorlevel 1 echo x64 BUILD FAILED

    # ===================================================================
    # 5. 编译 C# 控制程序
    # ===================================================================
    - name: Build C# (x86)
      shell: pwsh
      run: |
        dotnet publish -c Release -r win-x86 `
          -p:PlatformTarget=x86 `
          -p:PublishSingleFile=true `
          -p:SelfContained=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -p:DebugType=embedded `
          --self-contained true `
          -o publish\x86

    - name: Build C# (x64)
      shell: pwsh
      run: |
        dotnet publish -c Release -r win-x64 `
          -p:PlatformTarget=x64 `
          -p:PublishSingleFile=true `
          -p:SelfContained=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -p:DebugType=embedded `
          --self-contained true `
          -o publish\x64

    # ===================================================================
    # 6. 收集所有文件
    # ===================================================================
    - name: Collect release files
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path release_files

        # 驱动
        $sysFiles = Get-ChildItem -Recurse -Filter "FileProtectFS.sys" | Where-Object {
          $_.DirectoryName -notmatch "obj"
        }
        if ($sysFiles.Count -eq 0) {
          Write-Host "::warning::No driver .sys found, skipping driver artifacts"
        } else {
          $sysFiles | ForEach-Object {
            $arch = if ($_.FullName -match "\\x86\\") {"x86"} else {"x64"}
            $dest = "release_files/FileProtectFS-$arch.sys"
            Copy-Item $_.FullName $dest -Force
            Write-Host "Driver: $dest ($($_.Length/1KB -as [int]) KB)"
          }
        }

        # C#
        if (Test-Path publish\x86\FileProtect.exe) {
          Copy-Item publish\x86\FileProtect.exe release_files/FileProtect.exe
          $s = (Get-Item publish\x86\FileProtect.exe).Length
          Write-Host "C# x86: $( $s/1KB -as [int] ) KB"
        }
        if (Test-Path publish\x64\FileProtect.exe) {
          Copy-Item publish\x64\FileProtect.exe release_files/FileProtect-x64.exe
          $s = (Get-Item publish\x64\FileProtect.exe).Length
          Write-Host "C# x64: $( $s/1KB -as [int] ) KB"
        }

        # INF
        if (Test-Path driver\fileprotectfs.inf) {
          Copy-Item driver\fileprotectfs.inf release_files/
        }

        Write-Host "`n=== Release Files ==="
        Get-ChildItem release_files | ForEach-Object {
          Write-Host "$($_.Name)`t$($_.Length) bytes"
        }

    # ===================================================================
    # 7. 发布到 Releases
    # ===================================================================
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0-build.${{ github.run_number }}
        name: FileProtectFS Build #${{ github.run_number }}
        body: >
          FileProtectFS — 内核级文件权限保护驱动

          自动构建于 ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        draft: true
        generate_release_notes: false
        files: release_files/*
